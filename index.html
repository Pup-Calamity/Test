<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwordXStaff Relic Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --green: #22c55e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { color: var(--accent); margin-bottom: 8px; }
    
    .controls {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 16px; border-radius: 12px; margin-bottom: 24px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .controls select, .controls input {
      background: var(--bg); color: var(--text); border: 1px solid var(--card-border);
      padding: 8px; border-radius: 6px; outline: none; flex: 1; min-width: 150px;
    }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px;
    }
    .set-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .set-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
    .set-bonuses { font-size: 0.85rem; background: var(--bg); padding: 8px; border-radius: 6px; }
    
    .relic-item {
      border: 1px solid var(--card-border);
      padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    
    .bg-mythic { background: radial-gradient(circle, rgba(234, 179, 8, 0.45) 0%, rgba(234, 179, 8, 0.15) 100%); }
    .bg-legendary { background: radial-gradient(circle, rgba(250, 143, 68, 0.45) 0%, rgba(250, 143, 68, 0.15) 100%); }
    .bg-epic { background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, rgba(168, 85, 247, 0.15) 100%); }
    .bg-rare { background: radial-gradient(circle, rgba(59, 130, 246, 0.45) 0%, rgba(59, 130, 246, 0.15) 100%); }

    .relic-main-info {
      display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;
    }
    .relic-icon {
      width: 44px; height: 44px; border-radius: 6px; object-fit: contain;
      background: #000; border: 1px solid rgba(255,255,255,0.1);
    }
    .relic-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .relic-name { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 2px #000; }
    .relic-meta { font-size: 0.75rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .relic-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .relic-actions select {
      background: rgba(15, 23, 42, 0.8); color: var(--text); border: 1px solid var(--card-border); 
      padding: 6px; border-radius: 4px; outline: none; cursor: pointer; font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>SwordXStaff Relic Tracker</h1>
    <p>Track your sets, stars, and progress toward Awakened bonuses.</p>
  </header>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Search Set or Relic Name..." />
    <select id="filter-region"><option value="">All Regions</option></select>
    <select id="filter-stat"><option value="">All Stats</option></select>
    <select id="sort-by">
      <option value="progress">Closest to Awakened</option>
      <option value="id">Set ID</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

  <script>    
    let relics = [];
    let setsData = {};
    let userData = JSON.parse(localStorage.getItem('swordxstaff_relics')) || {};

    for (let id in userData) {
      if (userData[id].owned !== undefined && userData[id].stars === undefined) {
        userData[id].stars = userData[id].owned ? 0 : -1;
        delete userData[id].owned;
      }
    }
    localStorage.setItem('swordxstaff_relics', JSON.stringify(userData));

    fetch('Relics.txt')
      .then(response => {
        if (!response.ok) throw new Error("File not found");
        return response.json();
      })
      .then(data => {
        relics = data;
        processSets();
        populateFilters();
        renderGrid();
      })
      .catch(err => {
        document.getElementById('grid').innerHTML = `<p style="color:red; grid-column: 1 / -1; text-align: center;">Error loading Relics.txt. Ensure the file is uploaded to GitHub and named exactly 'Relics.txt'.</p>`;
      });

    function processSets() {
      setsData = {};
      relics.forEach(relic => {
        let setId = relic.set || 'Standalone';
        if (!setsData[setId]) {
          setsData[setId] = { id: setId, bonuses: relic.set_bonus || [], items: [] };
        }
        setsData[setId].items.push(relic);
      });
    }

    function populateFilters() {
      const regions = [...new Set(relics.map(r => r.region).filter(Boolean))].sort();
      let allStats = [];
      relics.forEach(r => {
        if (r.stats) allStats.push(...r.stats);
        if (r.set_bonus) r.set_bonus.forEach(b => allStats.push(...b));
      });
      const stats = [...new Set(allStats)].sort();
      
      const regionSelect = document.getElementById('filter-region');
      regions.forEach(r => regionSelect.innerHTML += `<option value="${r}">${r}</option>`);
      
      const statSelect = document.getElementById('filter-stat');
      stats.forEach(s => statSelect.innerHTML += `<option value="${s}">${s}</option>`);
    }

    window.saveUserProgress = function(id, field, value) {
      if (!userData[id]) userData[id] = { stars: -1 };
      if (field === 'stars') userData[id].stars = parseInt(value);
      
      localStorage.setItem('swordxstaff_relics', JSON.stringify(userData));
      if (field === 'stars') renderGrid(); 
    };

    function renderGrid() {
      const grid = document.getElementById('grid');
      const searchFilter = document.getElementById('search-input').value.toLowerCase().trim();
      const regionFilter = document.getElementById('filter-region').value;
      const statFilter = document.getElementById('filter-stat').value;
      const sortBy = document.getElementById('sort-by').value;

      let setsArray = Object.values(setsData).map(set => {
        let totalScore = 0;
        let maxScore = set.items.length * 6; 
        let minStars = 5;
        let ownedCount = 0;

        set.items.forEach(item => {
          let uItem = userData[item.id] || { stars: -1 };
          if (uItem.stars >= 0) {
            ownedCount++;
            totalScore += (1 + uItem.stars);
            if (uItem.stars < minStars) minStars = uItem.stars;
          } else {
            minStars = 0;
          }
        });

        set.isComplete = (ownedCount === set.items.length);
        set.minStars = set.isComplete ? minStars : 0;
        set.progress = totalScore / maxScore;
        return set;
      });

      if (sortBy === 'progress') setsArray.sort((a, b) => b.progress - a.progress);
      else setsArray.sort((a, b) => a.id === 'Standalone' ? 1 : b.id === 'Standalone' ? -1 : a.id - b.id);

      let fullHtml = '';

      setsArray.forEach(set => {
        const flatBonuses = set.bonuses.flat();
        const setHasBonusStat = !statFilter || flatBonuses.includes(statFilter);
        let setTitle = set.id === 'Standalone' ? 'Standalone Relics' : `${set.id}`;

        let filteredItems = set.items.filter(item => {
          const matchRegion = !regionFilter || item.region === regionFilter;
          const matchStat = setHasBonusStat || (item.stats && item.stats.includes(statFilter));
          
          // Check if search matches the Set ID/Name OR the specific Relic Name
          const matchSearch = !searchFilter || 
                              setTitle.toLowerCase().includes(searchFilter) || 
                              item.name.toLowerCase().includes(searchFilter);

          return matchRegion && matchStat && matchSearch;
        });

        if (filteredItems.length === 0) return;

        let bonusesHtml = '<span style="color: var(--text-muted)">No Set Bonus</span>';
        if (set.bonuses.length > 0) {
          bonusesHtml = set.bonuses.map((b, i) => {
            let isActive = (i === 0 && set.isComplete) || 
                           (i === 1 && set.isComplete && set.minStars >= 3) || 
                           (i === 2 && set.isComplete && set.minStars >= 5);
            let color = isActive ? 'var(--gold)' : 'var(--text-muted)';
            let label = i === 0 ? "Set" : i === 1 ? "3★" : "5★";
            return `<span style="color: ${color}; font-weight: ${isActive ? 'bold' : 'normal'}">${label}: ${b[0]}</span>`;
          }).join(' | ');
        }

        fullHtml += `
          <div class="set-card">
            <div class="set-header">
              <h3>${setTitle}</h3>
              <span style="color: var(${set.progress === 1 ? '--green' : '--text-muted'})">
                ${Math.round(set.progress * 100)}% Maxed
              </span>
            </div>
            <div class="set-bonuses">${bonusesHtml}</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
        `;

        filteredItems.forEach(item => {
          const userItem = userData[item.id] || { stars: -1 };
          const borderColor = userItem.stars >= 0 ? 'var(--green)' : 'var(--card-border)';
          const iconUrl = `https://lootandwaifus.com/treasures/swordxstaff/${item.icon}`;

          let rarityClass = 'bg-rare';
          if (item.rarity === 'Mythic') rarityClass = 'bg-mythic';
          else if (item.rarity === 'Legendary') rarityClass = 'bg-legendary';
          else if (item.rarity === 'Epic') rarityClass = 'bg-epic';
          else if (item.rarity === 'Rare') rarityClass = 'bg-rare';
          
          let displayArea = item.area || item.Area || '';
          let gachaDisplay = (item.gacha) ? '<span style="color:var(--purple); font-weight:bold;">[Gacha]</span>' : '';

          fullHtml += `
            <div class="relic-item ${rarityClass}" style="border-left: 4px solid ${borderColor}">
              <div class="relic-main-info">
                <img src="${iconUrl}" alt="${item.name}" class="relic-icon" loading="lazy" />
                <div class="relic-info">
                  <span class="relic-name">${item.name}</span>
                  <span class="relic-meta">${item.element || 'Unknown Element'} | ${(item.stats || []).join(', ')}</span>
                  <span class="relic-meta">${item.region || 'Unknown Region'} ${displayArea ? `| ${displayArea}` : '- Gacha Only'}</span>
                  <span class="relic-meta">${gachaDisplay}</span>
                </div>
              </div>
              <div class="relic-actions">
                <select style="border-color: ${borderColor}" onchange="saveUserProgress('${item.id}', 'stars', this.value)">
                  <option value="-1" ${userItem.stars === -1 ? 'selected' : ''}>Not Owned</option>
                  <option value="0" ${userItem.stars === 0 ? 'selected' : ''}>Owned (0★)</option>
                  <option value="1" ${userItem.stars === 1 ? 'selected' : ''}>1★</option>
                  <option value="2" ${userItem.stars === 2 ? 'selected' : ''}>2★</option>
                  <option value="3" ${userItem.stars === 3 ? 'selected' : ''}>3★</option>
                  <option value="4" ${userItem.stars === 4 ? 'selected' : ''}>4★</option>
                  <option value="5" ${userItem.stars === 5 ? 'selected' : ''}>5★</option>
                </select>
              </div>
            </div>
          `;
        });

        fullHtml += `</div></div>`;
      });

      grid.innerHTML = fullHtml;
    }

    document.getElementById('search-input').addEventListener('input', renderGrid);
    document.getElementById('filter-region').addEventListener('change', renderGrid);
    document.getElementById('filter-stat').addEventListener('change', renderGrid);
    document.getElementById('sort-by').addEventListener('change', renderGrid);

  </script>
</body>
</html>
